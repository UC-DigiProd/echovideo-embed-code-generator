<style>
    /* Import Lato font */
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');

    .generator-container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #414042;
    }
    .generator-container h3 {
        color: #414042;
        margin-bottom: 15px;
    }
    .generator-container label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
    }
    .generator-container input[type="text"],
    .generator-container textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: inherit;
        color: inherit;
    }
    
    /* Media Toggle Styles */
    .generator-container .radio-group {
        display: flex;
        gap: 20px;
        margin: 15px 0;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #eef0f2;
    }
    .generator-container .radio-option {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-weight: normal;
        margin-top: 0;
    }
    .generator-container .radio-option input {
        cursor: pointer;
        margin: 0;
    }

    .generator-container .button-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        margin-bottom: 20px;
    }
    .generator-container button {
        background-color: #009ABC;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
        font-family: inherit;
        transition: background-color 0.2s ease;
        flex-grow: 1;
        margin-top: 0;
    }
    .generator-container button:hover {
        background-color: #006C91;
    }
    
    #resetButton {
        background-color: #A9A9A9;
    }
    #resetButton:hover {
        background-color: #808080;
    }

    #outputCode {
        background-color: #f4f4f4;
        border: 1px solid #ddd;
        padding: 15px;
        margin-top: 5px;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 50px;
        font-family: monospace;
        color: #333;
    }
    #copyButton {
        padding: 8px 12px;
        font-size: 0.9em;
        margin-top: 10px;
        background-color: #009ABC; 
        transition: background-color 0.2s ease;
        display: block;
        width: 100%;
        box-sizing: border-box;
    }
    #copyButton:hover {
        background-color: #006C91;
    }
</style>

<div class="generator-container">
    <h3>Media Embed Code Generator (Canvas Sanitizer-Proof)</h3>

    <label>Select media source type:</label>
    <div class="radio-group">
        <label class="radio-option">
            <input type="radio" name="mediaType" value="echo" checked onchange="toggleMediaType()"> Echo360 LTI Asset
        </label>
        <label class="radio-option">
            <input type="radio" name="mediaType" value="youtube" onchange="toggleMediaType()"> YouTube / Standard Video
        </label>
    </div>

    <label for="videoTitle">Video title:</label>
    <input type="text" id="videoTitle" placeholder="e.g., AI changing use in society">

    <label for="source">Source:</label>
    <input type="text" id="source" value="UC">

    <label for="year">Year:</label>
    <input type="text" id="year" value="2026">

    <label id="inputCodeLabel" for="embedCode">Echo LTI iframe code (paste full code including the opening and closing iframe tags):</label>
    <textarea id="embedCode" rows="5" placeholder=""></textarea>

    <div class="button-group">
        <button onclick="generateCode()">Generate HTML code</button>
        <button id="resetButton" onclick="resetGenerator()">Reset generator</button>
    </div>

    <label for="outputCode">Generated code (copy and paste this code into the canvas page, replacing the original broken block):</label>
    <div id="outputCode"></div>
    
    <button id="copyButton" onclick="copyCode()" style="display: none;">Copy code to clipboard</button>
</div>

<script>
    function toggleMediaType() {
        const selectedType = document.querySelector('input[name="mediaType"]:checked').value;
        const label = document.getElementById('inputCodeLabel');
        const titleInput = document.getElementById('videoTitle');
        
        if (selectedType === 'echo') {
            label.textContent = "Echo LTI iframe code (paste full code including the opening and closing iframe tags):";
            titleInput.placeholder = "e.g., AI changing use in society";
        } else {
            label.textContent = "YouTube embed code / Standard Iframe (paste full iframe embed block):";
            titleInput.placeholder = "e.g., Introduction to UDL Framework";
        }
    }

    function generateCode() {
        const title = document.getElementById('videoTitle').value.trim();
        const source = document.getElementById('source').value.trim();
        const year = document.getElementById('year').value.trim();
        const embedCode = document.getElementById('embedCode').value.trim();
        const outputDiv = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyButton');
        const mediaType = document.querySelector('input[name="mediaType"]:checked').value;

        // 1. Validate Input
        if (!title || !embedCode) {
            outputDiv.textContent = 'Please provide a Video title and the raw iframe embed code.';
            copyBtn.style.display = 'none';
            return;
        }

        // 2. Extract the [src] attribute from the pasted iframe block
        const srcRegex = /src=["'](.*?)["']/i;
        const match = embedCode.match(srcRegex);
        
        if (!match || match.length < 2) {
            outputDiv.textContent = 'Error: Could not extract a valid [src] attribute from the provided iframe snippet.';
            copyBtn.style.display = 'none';
            return;
        }

        const srcValue = match[1];

        // 3. Set content parameters depending on target platform
        let iframeClass = "lti-embed";
        let ariaLabel = "Echo video player";
        let iframeTitle = `Echo video: ${title}`;
        let iframeAllow = "autoplay; encrypted-media; picture-in-picture; fullscreen";

        if (mediaType === 'youtube') {
            iframeClass = "video-embed";
            ariaLabel = "YouTube video player";
            iframeTitle = `YouTube video: ${title}`;
            iframeAllow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
        }

        // 4. Construct Sanitizer-Proof HTML Output
        const generatedHtml = 
`<div style="max-width: 704px; min-width: 320px; width: 100%; margin: 0 auto;">
    <div style="width: 100%; height: 65vw; max-height: 475px; overflow: hidden; background: #ffffff; border-radius: 4px; border: 1px solid #cdcdcd;">
        <iframe 
            class="${iframeClass}" 
            style="width: 100%; height: 100%; border: none; display: block;" 
            title="${iframeTitle}" 
            src="${srcValue}" 
            loading="lazy" 
            allowfullscreen="allowfullscreen" 
            allow="${iframeAllow}" 
            aria-label="${ariaLabel}">
        </iframe>
    </div>
</div>
<p style="text-align: center; margin-top: 12px;">Source: <a href="${srcValue}" target="_blank" rel="noopener">${title}</a> (${source}, ${year})</p>`;

        // 5. Output rendering
        outputDiv.textContent = generatedHtml;
        copyBtn.style.display = 'block'; 
    }
    
    function copyCode() {
        const outputDiv = document.getElementById('outputCode');
        const code = outputDiv.textContent;
        const copyBtn = document.getElementById('copyButton');
        
        if (!code || code.includes('Please provide') || code.includes('Error:')) {
             alert('No valid code generated yet to copy.');
             return;
        }

        navigator.clipboard.writeText(code).then(() => {
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = 'Copy code to clipboard';
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy: ', err);
            alert('Failed to copy the code. Please manually select and copy the text block.');
        });
    }

    function resetGenerator() {
        document.getElementById('videoTitle').value = '';
        document.getElementById('source').value = 'UC';
        document.getElementById('year').value = '2026';
        document.getElementById('embedCode').value = '';
        document.querySelectorAll('input[name="mediaType"]')[0].checked = true;
        
        toggleMediaType();
        document.getElementById('outputCode').textContent = '';
        document.getElementById('copyButton').style.display = 'none';
    }
</script>
